<!doctype html>
<html lang="en">

<style>
/* Same shell as template.html (sticky timeline header, filter rail, slide-over sheet), with a weapon icon index and frame tables. */
:root{
  --bg:#f3f2ee; --panel:#ffffff; --sunk:#e9e7e1; --fg:#1c1b19; --muted:#6b6860; --line:#d8d5cc;
  --key:#e08a00; --key-ink:#8a5200; --combat:#c2412d; --calm:#2f7a6b; --chip:#efece5;
  --f-start:#cfcbc0; --f-active:#c2412d; --f-gap:#e6b8ae; --f-rec:#e08a00; --f-free:#2f7a6b40; --f-armor:#4b5bd6; --f-iframe:#0e9bb8;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17181a; --panel:#202125; --sunk:#141517; --fg:#ecebe6; --muted:#9a988f; --line:#33343a;
  --key:#ffb020; --key-ink:#ffc65a; --combat:#ff7a63; --calm:#62c9b1; --chip:#2a2b30; color-scheme:dark;
  --f-start:#4a4b52; --f-active:#ff7a63; --f-gap:#6b3a33; --f-rec:#ffb020; --f-free:#62c9b14d; --f-armor:#8f9bff; --f-iframe:#4cc9e8}}
:root[data-theme="dark"]{
  --bg:#17181a; --panel:#202125; --sunk:#141517; --fg:#ecebe6; --muted:#9a988f; --line:#33343a;
  --key:#ffb020; --key-ink:#ffc65a; --combat:#ff7a63; --calm:#62c9b1; --chip:#2a2b30; color-scheme:dark;
  --f-start:#4a4b52; --f-active:#ff7a63; --f-gap:#6b3a33; --f-rec:#ffb020; --f-free:#62c9b14d; --f-armor:#8f9bff; --f-iframe:#4cc9e8}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--key);outline-offset:2px}
[hidden]{display:none!important}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:4px 10px;min-width:0;flex-wrap:wrap}
.club{display:inline-flex;align-items:center;gap:7px;color:var(--fg);text-decoration:none;font-family:var(--display);font-weight:700;font-size:14px;white-space:nowrap;padding:4px 10px 4px 8px;border:1px solid var(--line);border-radius:6px}
.club:hover{border-color:#5865f2}
.club svg{width:20px;height:20px;fill:#5865f2;flex:none}
.brand h1{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.brand h1 a{color:inherit;text-decoration:none}
.brand h1 a:hover{text-decoration:underline;text-underline-offset:3px}
.brand .tagline{font-size:13px;color:var(--muted);font-style:italic}
.brand .ver{font-family:var(--mono);font-size:11px;color:var(--muted)}
/* app switcher: its own row with the brand, styled as underlined tabs so it never reads as one of the filled filter toggles below */
.approw{padding-bottom:0;border-bottom:1px solid var(--line);align-items:flex-end}
.approw .club,.approw .brand{align-self:center;margin-bottom:12px}
.toolrow{padding-top:10px}
.apps{display:flex;gap:0 28px;flex-wrap:wrap;margin-left:8px}
.apps a{display:flex;gap:8px;align-items:flex-start;padding:4px 2px 9px;margin-bottom:-1px;border-bottom:3px solid transparent;color:var(--muted);text-decoration:none}
/* each app has its own badge colour and glyph (also its favicon); the colour also marks the current app */
.apps .ico{display:grid;place-items:center;width:28px;height:28px;flex:none;border-radius:7px;background:var(--app)}
.apps .ico svg{width:20px;height:20px;fill:#fff}
.apps a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--app)}
.apps a:not([aria-current]) .ico{opacity:.8}
.apps a:not([aria-current]):hover{color:var(--fg);border-bottom-color:var(--line)}
.apps a:not([aria-current]):hover .ico{opacity:1}
.apps b{display:block;font-family:var(--display);font-size:17px;font-weight:700;line-height:1.25}
.apps small{display:block;font-size:12px}
@media (max-width:820px){.apps{margin-left:0;gap:0 20px}.apps small{display:none}.apps b{font-size:15px}}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:0 10px;min-width:0}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;padding:9px 0;outline:none}
.search kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px}
/* the game bar gets its own row, ahead of the per-game counts, so switching games never moves or resizes it */
.grow{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;padding-bottom:10px;margin-top:-4px}
.grow .ver{flex:1 1 220px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.domain{display:flex;flex:none;max-width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.domain button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500}
.domain button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ruler{position:relative;height:30px;border-top:1px solid var(--line);overflow:hidden;font-family:var(--mono);font-size:10px;color:var(--muted)}
.ruler .ticks{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 12px);opacity:.9;height:8px}
.ruler .keys{position:absolute;inset:8px 0 0 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.ruler .keys::-webkit-scrollbar{display:none}
.kf{display:flex;align-items:center;gap:5px;white-space:nowrap;border:0;background:transparent;cursor:pointer;padding:2px 8px 2px 4px;border-radius:3px;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.kf i{width:8px;height:8px;transform:rotate(45deg);background:var(--line);display:inline-block}
.kf:hover{color:var(--fg)}
.kf[aria-pressed="true"]{color:var(--key-ink)}
.kf[aria-pressed="true"] i{background:var(--key)}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;padding-block:20px}
aside{position:sticky;top:120px;align-self:start;max-height:calc(100vh - 140px);overflow:auto;display:grid;gap:20px;padding-right:4px}
aside h2{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.flist{display:grid;gap:1px}
.fitem{display:flex;justify-content:space-between;gap:8px;border:0;background:transparent;text-align:left;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:13px}
.fitem:hover{background:var(--chip)}
.fitem[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.fitem span:last-child{font-family:var(--mono);font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:3px;padding:1px 7px;font-size:12px;cursor:pointer;font-family:var(--mono)}
.chip[aria-pressed="true"]{background:var(--key);border-color:var(--key);color:#1c1b19}
.range{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.range input{width:100%;accent-color:var(--key)}
.range b{font-family:var(--mono);color:var(--fg);font-weight:600}
.status{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.status h2{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance;display:flex;align-items:center;gap:10px}
.status h2 img{width:40px;height:40px}
.status p{margin:0;color:var(--muted)}
/* title, description and store links share one row; the description gives way first (truncated, full text on hover) */
.head1{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.head1 h2{flex:0 1 auto;min-width:0}
.head1 #sub{flex:1 1 16ch;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head1 #sub:empty{display:none}
.buy{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:0 0 auto;font-size:12px;color:var(--muted)}
.buy:empty{display:none}
.buy a{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 10px;color:var(--fg);text-decoration:none;font-weight:500}
.buy a.main{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.buy a:hover{border-color:var(--fg)}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.active{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.active button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer}
.sect{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;font-weight:600;display:flex;gap:8px;align-items:center}
.sect::after{content:"";flex:1;border-top:1px dashed var(--line)}
/* visual index: class tiles and weapon tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tile{display:grid;justify-items:center;align-content:start;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 6px 8px;cursor:pointer;text-align:center;min-width:0;position:relative}
.tile:hover{border-color:var(--key)}
.tile[aria-pressed="true"]{border-color:var(--key);box-shadow:inset 0 0 0 1px var(--key);background:var(--sunk)}
.ico{width:64px;height:64px;object-fit:contain;display:block;background:radial-gradient(circle at 50% 55%,var(--sunk) 0 60%,transparent 61%)}
.ico.ph{display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;color:var(--muted);border-radius:50%}
.tile b{font-family:var(--display);font-size:13.5px;line-height:1.15;font-weight:700;text-wrap:balance;overflow-wrap:anywhere}
.tile small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.wtiles{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px;margin-bottom:6px}
.wtiles .tile{flex:0 0 96px;padding:8px 4px 6px}
.wtiles .ico{width:52px;height:52px}
.wtiles b{font-size:11.5px;font-family:var(--body);font-weight:600}
.wtiles .tile.def .ico{font-size:13px;font-family:var(--mono);letter-spacing:.04em}
/* frame table */
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:4px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:8px;border-radius:2px;display:inline-block}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--sunk);font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;z-index:1}
th button{border:0;background:transparent;padding:0;cursor:pointer;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;gap:3px;align-items:center}
th button:hover{color:var(--fg)}
th[aria-sort] button{color:var(--key-ink)}
th[aria-sort="ascending"] button::after{content:"▲";font-size:8px}
th[aria-sort="descending"] button::after{content:"▼";font-size:8px}
td.n,th.n{text-align:right}
td.mono{font-family:var(--mono);font-size:12px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--chip)}
tr.grp td{background:var(--sunk);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;cursor:default}
tr.grp:hover td{background:var(--sunk)}
tr.grp td small{text-transform:none;letter-spacing:0;font-family:var(--body);margin-left:8px;font-weight:400}
.mname{font-weight:600}
.gr{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--muted)}
.fast{color:var(--calm);font-weight:600}
.slow{color:var(--combat)}
.tag{font-family:var(--mono);font-size:10.5px;border-radius:3px;padding:0 4px;margin-left:4px}
.tag.ha{background:var(--f-armor);color:#fff}
.tag.np{border:1px solid var(--combat);color:var(--combat)}
.cls{display:inline-flex;align-items:center;gap:6px}
.cls img{width:22px;height:22px}
/* frame strip: one cell per frame, scaled to the longest move in view */
.strip{position:relative;height:14px;width:220px;background:var(--sunk);border-radius:2px;overflow:hidden}
.strip span{position:absolute;top:0;bottom:0}
.strip .ar{top:auto;height:3px;bottom:0;background:var(--f-armor)}
.strip .ifr{top:0;height:3px;background:var(--f-iframe)}
.big .strip{width:100%;height:26px}
.big .ruler2{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.more{display:block;margin:10px auto 0;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 14px;cursor:pointer}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
/* detail sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .35);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--panel);z-index:21;border-left:1px solid var(--line);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 20px;display:grid;gap:18px;align-content:start}
.sheet .top{display:flex;justify-content:space-between;align-items:start;gap:12px}
.sheet h2{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 0 0;line-height:1.1;text-wrap:balance}
.sheet h3{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.close{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:4px 10px;cursor:pointer}
.src{font-family:var(--mono);font-size:10.5px;color:var(--key-ink);text-transform:uppercase;letter-spacing:.05em}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:5px;padding:8px 10px;display:grid;gap:0}
.stat small{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.meta{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:13px;margin:0}
.meta dt{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:2px}
.meta dd{margin:0;font-variant-numeric:tabular-nums}
.wlist{display:flex;flex-wrap:wrap;gap:6px}
.wlist button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:2px 8px 2px 2px;cursor:pointer;font-size:12px}
.wlist button:hover{border-color:var(--key)}
.wlist img,.wlist .ph{width:26px;height:26px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick a{border:1px solid var(--line);border-radius:4px;padding:5px 10px;text-decoration:none;font-size:13px;background:var(--sunk)}
.quick a:hover{border-color:var(--key)}
.note{font-size:12px;color:var(--muted);max-width:70ch}
.rail-toggle{display:none}
footer{color:var(--muted);font-size:12px;padding-block:24px;border-top:1px solid var(--line);margin-top:24px}
footer p{max-width:85ch;margin:0 0 8px}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;display:none}
  aside.open{display:grid}
  .rail-toggle{display:inline-block;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer}
  .status h2{font-size:22px}
  .strip{width:140px}
  .wtiles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}
}
/* 3D preview (frame-data/viewer3d.js) */
.v3d{display:grid;gap:8px}
.v3d-stage{position:relative;aspect-ratio:4/3;background:radial-gradient(ellipse at 50% 35%,var(--panel),var(--sunk));border:1px solid var(--line);border-radius:6px;overflow:hidden}
.v3d-stage canvas{display:block;width:100%;height:100%;touch-action:none}
.v3d-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:16px}
.v3d-hud{position:absolute;left:10px;top:8px;display:flex;align-items:baseline;gap:8px;pointer-events:none}
.v3d-hud b{font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.v3d-hud span{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.v3d-bar{display:flex;align-items:center;gap:6px}
.v3d-bar button,.v3d-bar select{border:1px solid var(--line);background:var(--sunk);border-radius:4px;height:30px;min-width:34px;cursor:pointer;font-size:12px}
.v3d-scrub{position:relative;flex:1;min-width:0}
.v3d-scrub .strip{width:100%;height:26px}
.v3d-scrub::after{content:"";position:absolute;top:-3px;bottom:-3px;left:var(--v3d-at,0%);width:2px;margin-left:-1px;background:var(--fg);pointer-events:none}
.v3d-scrub input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.v3d-opts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);align-items:center}
.v3d-opts label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.v3d-who{margin-left:auto;font-family:var(--mono);font-size:10.5px}
/* hitbox clips (frame-data/clipviewer.js): the captures' own grey behind them */
.clip-stage{background:#404040}
.clip-stage canvas,.clip-stage img{display:block;width:100%;height:100%;object-fit:contain}
.clip-stage .v3d-hud{color:#fff;text-shadow:0 1px 2px #000}.clip-stage .v3d-hud span{color:#ddd}
.clip-alts{display:flex;flex-wrap:wrap;gap:4px}
/* weapon buttons and the preview share a row that floats under the header while the table scrolls; Hide folds it */
.pick.dockon{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,46%);gap:0 20px;align-items:start;margin-bottom:12px}
.pick-l{min-width:0}
.dock{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding-top:4px;min-width:0}
.dock-head{display:flex;align-items:end;justify-content:space-between;gap:10px}
.dock-head small{font-family:var(--mono);font-size:10.5px;color:var(--key-ink);text-transform:uppercase;letter-spacing:.05em}
.dock-head h3{font-family:var(--display);font-size:16px;font-weight:800;margin:0;line-height:1.2}
/* one line each, so the stage sits at the same height whichever game or move is shown */
.dock-head>div{min-width:0}
.dock-head small,.dock-head h3{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-btns{display:flex;gap:6px;flex:none}
.dock .v3d-stage{aspect-ratio:auto;height:clamp(200px,30vh,330px)}
.pick.min .wtiles,.pick.min .v3d,.pick.min #sub,.pick.min #active{display:none}
@media (min-width:821px) and (min-height:640px){.pick.dockon{position:sticky;top:var(--hdr,0px);z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding-bottom:8px}}
@media (max-width:820px){.pick.dockon{grid-template-columns:minmax(0,1fr)}}
.more-c{width:1%;text-align:right;padding-left:4px!important}
.rowmore{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:0 9px;height:24px;cursor:pointer;font-weight:700;line-height:1}
.rowmore:hover{border-color:var(--key)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
tbody tr.on td{background:var(--chip);box-shadow:inset 0 1px var(--key),inset 0 -1px var(--key)}

<script>
// Frame data tab. Each game is one JSON file in the frame-data/1 format (see frame-data/README.md), listed in frame-data/games.json.
// Whatever produced the file (a web import now, the game files later), the page only reads that format.
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GRIP={'1h':'1H','2h':'2H','Paired':'PS','Offhand':'OH','Mounted':'Horse','any':'—'};
const PAGE=150;
let G=null,D=null,ICONS={},ICONSET={},T={},CL={},FAM={},GR=GRIP;
const st={game:null,fam:null,cls:null,w:null,types:new Set(),grips:new Set(),armor:false,multi:false,noparry:false,max:90,q:'',sort:null,dir:1,shown:PAGE};
// Columns: key, header, value getter, numeric, tooltip
const COLS=[
  ['name','Move',m=>m.name,0,'Move name as the source labels it'],
  ['class','Class',m=>m.class,0,'Weapon class'],
  ['grip','Grip',m=>m.grip,0,'1H one-handed, 2H two-handed, PS powerstance (paired), OH off-hand'],
  ['strip','Frames',m=>m.total||0,1,'Startup, active and recovery frames to scale'],
  ['startup','Startup',m=>m.startup,1,'First frame the hitbox is out'],
  ['active','Active',m=>m.activeFrames,1,'Frames with a hitbox out, across all hits'],
  ['recovery','Recovery',m=>m.recovery,1,'Frames from the last active frame until you can dodge'],
  ['dodge','→ Dodge',m=>m.cancels.dodge,1,'First frame you can cancel into a dodge or roll'],
  ['attack','→ Attack',m=>m.cancels.attack,1,'First frame you can chain or cancel into an attack'],
  ['total','Total',m=>m.total,1,'Length of the animation in frames'],
  ['mv','MV',m=>m.damage.mv,1,'Motion value: damage multiplier of the first hit (100 = base)'],
  ['poise','Poise',m=>m.damage.poise,1,'Poise damage of the first hit'],
  ['dtype','Type',m=>m.damage.type,0,'Physical damage type of the first hit'],
  // fighting-game columns, shown when a game lists them in "columns"
  ['input','Input',m=>m.input,0,'Command input'],
  ['blockAdv','On block',m=>m.blockAdv,1,'Frame advantage on block (KD: knockdown)'],
  ['hitAdv','On hit',m=>m.hitAdv,1,'Frame advantage on hit (KD: knockdown)'],
  ['dmg','Damage',m=>m.damage.amount,1,'Damage of the move'],
  ['stun','Stun',m=>m.damage.stun,1,'Stun damage of the move'],
  ['guard','Guard',m=>m.damage.guard,0,'How it is blocked or parried: H high, L low, H+L either'],
  ['cancel','Cancels',m=>(m.cancelTo||[]).join(' '),0,'What the move cancels into'],
  ['landing','Landing',m=>m.landingLag,1,'Landing lag: frames stuck on landing during the move'],
  ['sstun','Shield stun',m=>m.shieldStun,1,'Frames the defender is stuck in shield after it is hit'],
];
const DEFAULT_COLS=['name','class','grip','strip','startup','active','recovery','dodge','attack','total','mv','poise','dtype'];
// Wording a game can override with "labels" (Elden Ring's defaults)
const LABELS={class:'Weapon class',classes:'weapon classes',allClasses:'All classes',allFamilies:'All weapons',grip:'Grip',everyClass:'Every class · default movesets',patch:'patch ',
  pickClass:'Pick a weapon class to see its moveset by move type, or filter and sort every class at once below.',classView:'default moveset, by move type. Pick a weapon below for its exact moveset.',
  recovery:'Frames from the last active frame until you can dodge'};
let L=LABELS,SHOW=DEFAULT_COLS,CN={};
// a game can rename a column with "columnNames": {key: name} or {key: [name, tooltip]}
const colName=c=>{const o=CN[c[0]];return o==null?c[1]:Array.isArray(o)?o[0]:o};
const colTip=c=>{const o=CN[c[0]];return Array.isArray(o)&&o[1]?o[1]:c[0]==='recovery'?L.recovery:c[4]};
const lastActive=m=>m.active.length?m.active[m.active.length-1][1]:0;
const num=v=>typeof v==='number'?v:v==null?null:Number.isFinite(parseFloat(v))?parseFloat(v):null;
const iconSrc=n=>n&&ICONS[n]?G.icons+ICONS[n].file:null;
const icoHtml=(n,cls='ico')=>{const s=iconSrc(n);return s?`<img class="${cls}" loading="lazy" alt="" src="${esc(s)}">`:`<span class="${cls} ph" aria-hidden="true">${esc((n||'?').replace(/[^A-Za-z]/g,'').slice(0,1))}</span>`};

async function loadGame(id){
  G=GAMES.find(g=>g.id===id)||GAMES[0];st.game=G.id;
  $('#table').innerHTML='<div class="empty">Loading frame data…</div>';
  const [d,ic]=await Promise.all([fetch(G.data).then(r=>r.json()),fetch(G.icons+'icons.json').then(r=>r.ok?r.json():{icons:{}}).catch(()=>({icons:{}}))]);
  D=d;ICONS=ic.icons||{};ICONSET=ic;
  GR={...GRIP,...Object.fromEntries((D.grips||[]).filter(g=>g.short).map(g=>[g.id,g.short]))};
  T=Object.fromEntries(D.moveTypes.map((t,i)=>[t.id,{...t,i}]));
  CL=Object.fromEntries(D.classes.map((c,i)=>[c.id,{...c,i}]));
  FAM=Object.fromEntries(D.families.map(f=>[f.id,f]));
  L={...LABELS,...(D.labels||{})};SHOW=D.columns||DEFAULT_COLS;CN=D.columnNames||{};
  $('#hClass').textContent=L.class;$('#q').placeholder=L.search||'Search moves, weapons…';$('#hGrip').textContent=L.grip;
  $('#fArmor').hidden=!D.moves.some(m=>m.armor.length);
  D.moves.forEach(m=>{m.hay=(m.name+' '+m.class+' '+CL[m.class].name+' '+T[m.type].name+' '+(m.damage.type||'')+' '+(m.input||'')+' '+m.weapons.map(i=>CL[m.class].weapons[i]).join(' ')).toLowerCase()});
  st.max=Math.max(...D.moves.map(m=>m.startup||0));$('#maxStart').max=st.max;
  fromHash();renderAll();
}
// The moves a selection shows: a weapon shows exactly the animations it uses; a class (or nothing) shows default movesets
function pool(skip){
  return D.moves.filter(m=>{
    if(st.cls){if(m.class!==st.cls)return false;
      if(st.w!=null){if(!m.weapons.includes(st.w))return false}else if(!m.default)return false}
    else{if(!m.default)return false;if(st.fam&&CL[m.class].family!==st.fam)return false}
    if(skip!=='type'&&st.types.size&&!st.types.has(m.type))return false;
    if(skip!=='grip'&&st.grips.size&&!st.grips.has(m.grip))return false;
    if(skip!=='armor'&&st.armor&&!m.armor.length)return false;
    if(skip!=='multi'&&st.multi&&m.hits<2)return false;
    if(skip!=='noparry'&&st.noparry&&m.parryable)return false;
    if(m.startup!=null&&m.startup>st.max)return false;
    if(st.q&&!st.q.split(/\s+/).every(w=>m.hay.includes(w)))return false;
    return true})}
function count(list,f){const c=new Map();list.forEach(m=>{const k=f(m);c.set(k,(c.get(k)||0)+1)});return c}

function renderAll(){
  $('#games').innerHTML=GAMES.map(g=>`<button data-game="${esc(g.id)}" aria-pressed="${g.id===st.game}">${esc(g.name)}</button>`).join('');
  $('#ver').title=$('#ver').textContent=`${D.moves.length.toLocaleString()} moves · ${D.classes.length} ${L.classes} · ${L.patch}${D.game.version}`;
  $('#keys').innerHTML=`<button class="kf" data-fam="" aria-pressed="${!st.fam&&!st.cls}"><i></i>${esc(L.allFamilies)}</button>`+D.families.map(f=>`<button class="kf" data-fam="${f.id}" aria-pressed="${st.fam===f.id}"><i></i>${esc(f.name)}</button>`).join('');
  const tc=count(pool('type'),m=>m.type);
  $('#types').innerHTML=D.moveTypes.filter(t=>tc.get(t.id)||st.types.has(t.id)).map(t=>`<button class="fitem" data-type="${t.id}" aria-pressed="${st.types.has(t.id)}" title="${esc(t.description)}"><span>${esc(t.name)}</span><span>${tc.get(t.id)||0}</span></button>`).join('');
  const gc=count(pool('grip'),m=>m.grip);
  $('#grips').innerHTML=D.grips.filter(g=>gc.get(g.id)||st.grips.has(g.id)).map(g=>`<button class="chip" data-grip="${g.id}" aria-pressed="${st.grips.has(g.id)}" title="${esc(g.name)}">${esc(g.name)} ${gc.get(g.id)||0}</button>`).join('');
  $('#nArmor').textContent=pool('armor').filter(m=>m.armor.length).length;
  $('#nMulti').textContent=pool('multi').filter(m=>m.hits>1).length;
  $('#nNoParry').textContent=pool('noparry').filter(m=>!m.parryable).length;
  ['fArmor','fMulti','fNoParry'].forEach((id,i)=>$('#'+id).setAttribute('aria-pressed',[st.armor,st.multi,st.noparry][i]));
  $('#maxStart').value=st.max;$('#maxOut').textContent=st.max+' frames';
  $('#classes').innerHTML=`<button class="fitem" data-cls="" aria-pressed="${!st.cls}"><span>${esc(L.allClasses)}</span><span>${D.classes.length}</span></button>`+D.classes.filter(c=>!st.fam||c.family===st.fam).map(c=>`<button class="fitem" data-cls="${esc(c.id)}" aria-pressed="${st.cls===c.id}"><span>${esc(c.name)}</span><span>${c.weapons.length||c.moves}</span></button>`).join('');
  renderHead();renderIndex();renderTable();
  const buy=storeLinks(G.id),sg=STORES.games?.[G.id];
  $('#buy').innerHTML=buy.length?`Get ${esc(sg?.via||G.name)}: `+buy.map(b=>`<a class="${b.main?'main':''}" href="${esc(b.url)}" target="_blank" rel="${b.paid?'sponsored ':''}noopener">${esc(b.name)} ↗</a>`).join(''):'';
  const ext=(u,t)=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`;
  $('#foot').innerHTML=(D.source.links?`<p><b>Source.</b> ${esc(D.source.note)} ${D.source.links.map(l=>ext(l.url,l.name+' ↗')).join(' ')}</p>`
    :`<p><b>Source.</b> ${esc(D.game.name)} data comes from the ${ext(D.source.url,D.source.name)} by ${esc(D.source.author)} (patch ${esc(D.game.version)}, retrieved ${esc(D.source.retrieved)}), reshaped here into weapon classes and move types. Every move links back to it. ${D.source.note?esc(D.source.note.replace(/https?:\S+/,'')):''}${ext('https://ko-fi.com/sovietspaceship','Ko-fi ↗')}</p>`)+`
  ${ICONSET.sources?`<p>${esc(ICONSET.lead||"Weapon icons are the game's inventory art")}, from ${ICONSET.sources.map(x=>ext(x.url,x.name)).join(' and ')}. ${esc((ICONSET.note||'').replace(/^Icons are the game's inventory art, /,''))}</p>`:''}
  <p>${esc(D.game.frameNote)} Values cover the first hit of a move; open a move for every window.</p>
  ${buy.some(b=>b.paid)?'<p>Some store links are affiliate links: buying through them supports this library at no extra cost to you.</p>':''}`;
  writeHash();
}
function renderHead(){
  const c=st.cls&&CL[st.cls],w=c&&st.w!=null?c.weapons[st.w]:null,f=st.fam&&FAM[st.fam];
  $('#ttl').innerHTML=c?`${icoHtml(w||c.icon,'')} ${esc(w||c.name)}`:esc(f?f.name:`${D.game.name} move explorer`);
  $('#sub').textContent=$('#sub').title=c?(w?`${c.name} · the animations this weapon uses, by move type.`:`${c.name} · ${L.classView}`)
    :L.pickClass;
  const act=[];if(st.q)act.push(['q',`“${st.q}”`]);st.types.forEach(t=>act.push(['type:'+t,T[t].name]));st.grips.forEach(g=>act.push(['grip:'+g,GR[g]]));
  if(st.armor)act.push(['armor','Hyper armor']);if(st.multi)act.push(['multi','Multi-hit']);if(st.noparry)act.push(['noparry',"Can't be parried"]);
  if(st.max<+$('#maxStart').max)act.push(['max',`Startup ≤ ${st.max}`]);
  $('#active').innerHTML=act.map(([k,l])=>`<button data-clear="${esc(k)}">${esc(l)} ✕</button>`).join('')+(act.length>1?`<button data-clear="all">Clear all</button>`:'');
}
function renderIndex(){
  if(st.cls){
    const c=CL[st.cls];$('#index').innerHTML='';
    if(!c.weapons.length){$('#weapons').innerHTML=`<div class="sect">${c.moves} moves · ${esc(c.name)} <button class="chip" data-cls="" style="margin-left:4px">${esc(L.allClasses)}</button></div>`;return}
    $('#weapons').innerHTML=`<div class="sect">${c.weapons.length} weapon${c.weapons.length===1?'':'s'} · ${esc(c.name)} <button class="chip" data-cls="" style="margin-left:4px">All classes</button></div>
    <div class="wtiles" role="group" aria-label="Weapon">${[`<button class="tile def" data-w="" aria-pressed="${st.w==null}"><span class="ico ph">ALL</span><b>Class default</b></button>`]
      .concat(c.weapons.map((w,i)=>`<button class="tile" data-w="${i}" aria-pressed="${st.w===i}" title="${esc(w)}">${icoHtml(w)}<b>${esc(w)}</b></button>`)).join('')}</div>`;
    return}
  $('#weapons').innerHTML='';
  const fams=D.families.filter(f=>!st.fam||f.id===st.fam);
  $('#index').innerHTML=fams.map(f=>`<div class="sect">${esc(f.name)}</div><div class="tiles">${D.classes.filter(c=>c.family===f.id).map(c=>`<button class="tile" data-cls="${esc(c.id)}">${icoHtml(c.icon)}<b>${esc(c.name)}</b><small>${c.weapons.length?`${c.weapons.length} weapon${c.weapons.length===1?'':'s'}`:`${c.moves} moves`}</small></button>`).join('')}</div>`).join('');
}
// One bar per move: startup, active (gaps between hits lighter), recovery until dodge, then free frames to the end.
function stripHtml(m,scale){
  const end=Math.max(m.total||0,m.cancels.dodge||0,lastActive(m));
  const pc=f=>(f/scale*100).toFixed(2)+'%',seg=(a,b,c,cls='')=>b>a?`<span class="${cls}" style="left:${pc(a)};width:${pc(b-a)};background:var(${c})"></span>`:'';
  let h=m.active.length?seg(0,m.startup-1,'--f-start'):'';
  m.active.forEach(([s,e],i)=>{if(i)h+=seg(m.active[i-1][1],s-1,'--f-gap');h+=seg(s-1,e,'--f-active')});
  const last=lastActive(m),dodge=m.cancels.dodge?m.cancels.dodge-1:null;
  if(!m.active.length)h+=seg(0,end,'--f-start');else if(dodge!=null){h+=seg(last,dodge,'--f-rec');h+=seg(dodge,end,'--f-free')}else h+=seg(last,end,'--f-rec');
  m.armor.forEach(([s,e])=>h+=`<span class="ar" style="left:${pc(s-1)};width:${pc(Math.min(e,end)-s+1)}"></span>`);
  m.iframes.forEach(([s,e])=>h+=`<span class="ifr" style="left:${pc(s-1)};width:${pc(Math.min(e,end)-s+1)}"></span>`);
  return `<div class="strip" title="Startup ${m.startup??'—'} · active ${m.active.map(a=>a.join('–')).join(', ')} · dodge ${m.cancels.dodge??'—'} · total ${m.total??'—'}">${h}</div>`}
function legendHtml(){const has=k=>D.moves.some(m=>k==='free'?m.cancels.dodge:m[k].length);
  return [['--f-start','Startup'],['--f-active','Active'],['--f-gap','Between hits'],['--f-rec','Recovery'],['--f-free','Can dodge','free'],['--f-armor','Hyper armor','armor'],['--f-iframe','I-frames','iframes']].filter(x=>!x[2]||has(x[2])).map(([c,l])=>`<span><i style="background:var(${c})"></i>${l}</span>`).join('')}
function cell(k,m,scale){
  const v=COLS.find(c=>c[0]===k)[2](m);
  switch(k){
    case 'name':return `<td><span class="mname">${esc(m.name)}</span>${m.armor.length?'<span class="tag ha" title="Hyper armor">HA</span>':''}${m.parryable!==false||!m.active.length?'':'<span class="tag np" title="Cannot be parried">NP</span>'}${m.hits>1?`<span class="tag" style="border:1px solid var(--line)" title="Hits">×${m.hits}</span>`:''}</td>`;
    case 'class':return `<td><span class="cls">${icoHtml(CL[m.class].icon,'')}${esc(CL[m.class].weapons.length?m.class:CL[m.class].name)}</span></td>`;
    case 'grip':return `<td><span class="gr" title="${esc((D.grips.find(g=>g.id===m.grip)||{}).name)}">${GR[m.grip]}</span></td>`;
    case 'strip':return `<td>${stripHtml(m,scale)}</td>`;
    case 'startup':return `<td class="n mono ${v==null?'':v<=12?'fast':v>=30?'slow':''}">${v??'—'}</td>`;
    case 'dtype':case 'input':case 'guard':return `<td>${esc(v||'—')}</td>`;
    case 'cancel':return `<td class="mono">${esc(v||'—')}</td>`;
    case 'landing':case 'sstun':case 'dmg':return `<td class="n mono">${esc(v??'—')}</td>`;
    case 'blockAdv':case 'hitAdv':{const n=num(v);return `<td class="n mono ${n==null?'':n>0?'fast':n<0?'slow':''}">${v==null?'—':esc(typeof v==='number'&&v>0?'+'+v:v)}</td>`}
    default:return `<td class="n mono">${v??'—'}</td>`}}
function sorted(list){
  if(!st.sort)return list;const c=COLS.find(x=>x[0]===st.sort),f=c[2];
  const g=c[3]?m=>num(f(m)):m=>f(m)||null;
  return [...list].sort((a,b)=>{const x=g(a),y=g(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return (c[3]?x-y:String(x).localeCompare(String(y)))*st.dir})}
function renderTable(){
  const list=pool(),cols=SHOW.filter(k=>COLS.some(c=>c[0]===k)&&(k!=='class'||!st.cls));
  $('#count').textContent=`${list.length.toLocaleString()} moves`;
  $('#legend').innerHTML=list.length?legendHtml():'';
  if(!list.length){dock(list);$('#table').innerHTML='<div class="empty">No moves match these filters. Clear a filter or widen the startup limit.</div>';return}
  const scale=Math.min(150,Math.max(...list.map(m=>Math.max(m.total||0,m.cancels.dodge||0))));
  const head=`<thead><tr>${cols.map(k=>{const c=COLS.find(x=>x[0]===k);return `<th class="${c[3]&&k!=='strip'?'n':''}" ${st.sort===k?`aria-sort="${st.dir>0?'ascending':'descending'}"`:''} title="${esc(colTip(c))}"><button data-sort="${k}">${esc(k==='class'?L.class:colName(c))}</button></th>`}).join('')}<th class="more-c"><span class="vh">Details</span></th></tr></thead>`;
  const row=m=>`<tr data-m="${esc(m.class+'|'+m.id)}"${DOCK.key===m.class+'|'+m.id?' class="on"':''}>${cols.map(k=>cell(k,m,scale)).join('')}<td class="more-c"><button class="rowmore" data-open="${esc(m.class+'|'+m.id)}" title="Frame details" aria-label="Frame details for ${esc(m.name)}">…</button></td></tr>`;
  let body;
  if(st.cls&&!st.sort){
    // class view: grouped by move type in play order
    const by=new Map();list.forEach(m=>{if(!by.has(m.type))by.set(m.type,[]);by.get(m.type).push(m)});
    body=[...by].sort((a,b)=>T[a[0]].i-T[b[0]].i).map(([t,ms])=>`<tr class="grp"><td colspan="${cols.length+1}">${esc(T[t].name)} · ${ms.length}<small>${esc(T[t].description)}</small></td></tr>`+ms.map(row).join('')).join('');
    $('#table').innerHTML=`<div class="tablewrap"><table>${head}<tbody>${body}</tbody></table></div>`;dock(list);return}
  const s=sorted(list),shown=s.slice(0,st.shown);
  body=shown.map(row).join('');
  dock(list);
  $('#table').innerHTML=`${!st.cls?`<div class="sect">${esc(L.everyClass)}</div>`:''}<div class="tablewrap"><table>${head}<tbody>${body}</tbody></table></div>${s.length>shown.length?`<button class="more" id="more">Show ${Math.min(PAGE,s.length-shown.length)} more of ${(s.length-shown.length).toLocaleString()}</button>`:''}`;
}
function openMove(key){
  const [cls,id]=key.split('|'),m=D.moves.find(x=>x.class===cls&&x.id===id);if(!m)return;
  const c=CL[m.class],end=Math.max(m.total||0,m.cancels.dodge||0);
  const win=a=>a.length?a.map(([s,e])=>s===e?s:`${s}–${e}`).join(', '):'—';
  const can=[['attack','Attack'],['dodge','Dodge / roll'],['block','Block'],['skill','Skill'],['item','Item'],['move','Walk / run']].filter(([k])=>m.cancels[k]).map(([k,l])=>`<dt>${l}</dt><dd>from frame ${m.cancels[k]}</dd>`).join('');
  const ws=m.weapons.length?m.weapons:[];
  const fmt=v=>typeof v==='number'&&v>0?'+'+v:v??'—';
  const DMG=[['type','Damage type'],['amount','Damage'],['stun','Stun'],['guard','Guard'],['mv','Motion value'],['poise','Poise damage'],['level','Damage level'],['stamina','Stamina']];
  const dm=c.weapons.length?DMG.filter(([k])=>['type','mv','poise','level','stamina'].includes(k)):DMG.filter(([k])=>m.damage[k]!=null);
  const AV=[['blockAdv',colName(['blockAdv','On block'])],['hitAdv','On hit'],['crHitAdv','On crouching hit'],['shieldStun','Shield stun'],['landingLag','Landing lag']].filter(([k])=>k in m);
  const adv=AV.length?`<section><h3>Advantage</h3><dl class="meta">${AV.map(([k,l])=>`<dt>${esc(l)}</dt><dd>${esc(k==='blockAdv'||k==='hitAdv'||k==='crHitAdv'?fmt(m[k]):m[k]??'—')}</dd>`).join('')}</dl></section>`:'';
  const ext=m.extra?`<section><h3>More</h3><dl class="meta">${Object.entries(m.extra).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></section>`:'';
  const cto=m.cancelTo?`<dt>Cancels into</dt><dd>${esc(m.cancelTo.join(', ')||'Nothing')}</dd>`:'';
  $('#sheet').innerHTML=`<div class="top"><div><div class="src">${esc(D.game.name)} · ${esc(c.name)} › ${esc(T[m.type].name)} · ${GR[m.grip]}</div><h2 id="dName">${esc(m.name)}</h2>${m.input?`<div class="src">${esc(m.input)}</div>`:''}</div><button class="close" id="close">Close</button></div>
  <div class="stats"><div class="stat"><small>Startup</small><b>${m.startup??'—'}</b></div><div class="stat"><small>Active</small><b>${m.activeFrames??'—'}</b></div><div class="stat"><small>Recovery</small><b>${m.recovery??'—'}</b></div><div class="stat"><small>Total</small><b>${m.total??'—'}</b></div></div>
  <section class="big"><h3>Timeline (${D.game.fps} fps)</h3>${stripHtml(m,end||1)}<div class="ruler2"><span>1</span><span>${Math.round(end/2)}</span><span>${end}</span></div><div class="legend" style="margin-top:8px">${legendHtml()}</div></section>
  <section><h3>Windows</h3><dl class="meta"><dt>Active</dt><dd>${win(m.active)} (${m.hits} hit${m.hits===1?'':'s'})</dd><dt>Hyper armor</dt><dd>${win(m.armor)}</dd><dt>I-frames</dt><dd>${win(m.iframes)}</dd>${m.charge?`<dt>Charge</dt><dd title="Frames the button is held before this charged version comes out">${m.charge} frames held</dd>`:''}<dt>Parryable</dt><dd>${m.parryable?'Yes':'No'}</dd></dl></section>
  <section><h3>Cancels</h3><dl class="meta">${can||cto||'<dt>—</dt><dd>No cancel windows recorded</dd>'}${can?cto:''}</dl></section>
  ${adv}${dm.length?`<section><h3>${c.weapons.length?'First hit':'Damage'}</h3><dl class="meta">${dm.map(([k,l])=>`<dt${k==='level'?' title="How hard the hit staggers"':''}>${l}</dt><dd>${esc(m.damage[k]??'—')}</dd>`).join('')}</dl></section>`:''}${ext}
  ${c.weapons.length?`<section><h3>Used by (${ws.length||'default moveset'})</h3>${ws.length?`<div class="wlist">${ws.map(i=>`<button data-pickw="${i}" data-pickc="${esc(c.id)}">${icoHtml(c.weapons[i],'')}${esc(c.weapons[i])}</button>`).join('')}</div>`:'<p class="note">Part of the class default moveset.</p>'}</section>`:''}
  <section><h3>Source</h3><div class="quick">${m.url||D.source.moveUrl?`<a target="_blank" rel="noopener" href="${esc(m.url||D.source.moveUrl.replace('{id}',m.id))}">Open in ${esc(D.source.moveName||D.source.name)} ↗</a>`:''}${(m.clips||[]).map(x=>`<a target="_blank" rel="noopener" href="${esc(x.source)}">Hitbox GIF${m.clips.length>1?' · '+esc(x.label):''} ↗</a>`).join('')}<a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(D.game.name+' '+c.name+' '+m.name.replace(/^(1h|2h)\s/,''))}">YouTube ↗</a></div><p class="note">Animation ${esc(m.id)}. ${esc(D.game.frameNote)}</p></section>`;
  $('#sheet').hidden=false;$('#scrim').hidden=false;$('#close').focus()}
// Docked preview above the table: games with exported models (games.json "models") get the 3D viewer, games with
// sprite sheets ("sprites") the 2D hitbox viewer, games with hitbox clips ("clips") the clip viewer. Clicking a row it
// covers swaps the move in place, other rows open the detail sheet. The 3D viewer holds the picked weapon, else each
// move's class preview weapon.
// Bump ?v= whenever viewer3d.js, sprites2d.js or clipviewer.js changes: browsers and Pages cache them, and a stale copy next to a new page breaks the dock
const VIEWER='./frame-data/viewer3d.js?v=6',VIEWER2D='./frame-data/sprites2d.js?v=2',CLIPVIEWER='./frame-data/clipviewer.js?v=1';
// the models and sprites viewers load per class (classData); the clip viewer reads each move's clips
const byClass=()=>G.models||G.sprites;
const DOCK={key:null,view:null,game:null,cls:null,w:null,cm:null,seq:0};
const pickName=()=>st.cls&&st.w!=null?CL[st.cls].weapons[st.w]:null;
// whether the docked viewer can show a move, and its length there
const canDock=m=>byClass()?m.class===DOCK.cls&&!!DOCK.cm?.moves[m.id]:!!m.clips?.length;
function frameState(m,f){
  const inW=w=>w.some(([s,e])=>f>=s&&f<=e),last=lastActive(m);
  const s=!m.active.length?'':f<m.startup?'Startup':inW(m.active)?'Active':f<last?'Between hits':m.cancels.dodge&&f>=m.cancels.dodge?'Can dodge':'Recovery';
  return [s,inW(m.armor)&&'hyper armor',inW(m.iframes)&&'i-frames'].filter(Boolean).join(' · ')}
const moveOf=key=>{const [cls,id]=key.split('|');return D.moves.find(x=>x.class===cls&&x.id===id)};
function dockOn(on){$('#dock').hidden=!on;$('#pick').classList.toggle('dockon',on)}
function pickMin(min){$('#pick').classList.toggle('min',min);$('#pickMin').textContent=min?'Show':'Hide';$('#pickMin').setAttribute('aria-expanded',!min);try{localStorage.setItem('fd-pick-min',min?'1':'')}catch(e){}}
async function dock(list){
  const sec=$('#dock'),seq=++DOCK.seq;
  if(!(byClass()||G.clips)||!st.cls){dockOn(false);return}
  try{
    const v=await import(G.models?VIEWER:G.sprites?VIEWER2D:CLIPVIEWER),cm=byClass()?await v.classData(byClass(),st.cls):null;
    if(seq!==DOCK.seq)return;
    const ok=byClass()?(cm?list.filter(m=>cm.moves[m.id]):[]):list.filter(m=>m.clips?.length);
    if(!ok.length){dockOn(false);return}
    dockOn(true);DOCK.cm=cm;
    sec.setAttribute('aria-label',G.models?'3D preview':G.sprites?'Hitbox preview':'Hitbox clip');
    if(DOCK.game!==G.id){if(DOCK.view)DOCK.view.then(x=>x.dispose());DOCK.view=Promise.resolve(v.createViewer($('#dockView'),byClass()||G.clips));DOCK.game=G.id;DOCK.key=null}
    // keep the move on show while it is still in the list (re-shown when the picked weapon changes); otherwise show
    // the list's first move
    const cur=ok.find(m=>m.class+'|'+m.id===DOCK.key);
    if(DOCK.cls!==st.cls||!cur)preview(ok[0]);else if(DOCK.w!==st.w)preview(cur);
    DOCK.cls=st.cls;DOCK.w=st.w;
  }catch(e){if(seq===DOCK.seq){dockOn(true);$('#dockView').innerHTML=`<div class="empty">Could not load the preview (${esc(e.message)}).</div>`}}}
async function preview(m){
  const key=m.class+'|'+m.id;DOCK.key=key;
  document.querySelectorAll('tbody tr.on').forEach(r=>r.classList.remove('on'));
  document.querySelector(`tbody tr[data-m="${CSS.escape(key)}"]`)?.classList.add('on');
  $('#dockSrc').textContent=`${CL[m.class].name} › ${T[m.type].name} · ${GR[m.grip]}`;
  $('#dockName').title=$('#dockName').textContent=`${m.name} · `+(m.active.length?`startup ${m.startup}, active ${m.active.map(([s,e])=>s===e?s:s+'–'+e).join(', ')}`:`${m.total??'—'} frames`);
  const view=await DOCK.view;
  if(DOCK.key!==key)return;
  if(byClass()){if(!DOCK.cm)return;view.show(m,{weapon:pickName(),strip:stripHtml(m,DOCK.cm.moves[m.id].frames),state:f=>frameState(m,f)})}
  else view.show(m,{strip:n=>stripHtml(m,n),state:f=>frameState(m,f)});
}
function closeSheet(){$('#sheet').hidden=true;$('#scrim').hidden=true}
// Shareable state in the hash: #g=elden-ring&c=Katana&w=Moonveil&t=light,heavy
function writeHash(){
  const p=new URLSearchParams();if(st.game&&st.game!==GAMES[0].id)p.set('g',st.game);if(st.fam&&!st.cls)p.set('f',st.fam);if(st.cls)p.set('c',st.cls);
  if(st.cls&&st.w!=null)p.set('w',CL[st.cls].weapons[st.w]);if(st.types.size)p.set('t',[...st.types].join(','));if(st.grips.size)p.set('grip',[...st.grips].join(','));
  if(st.sort)p.set('s',(st.dir<0?'-':'')+st.sort);const h=p.toString();
  try{history.replaceState(null,'',h?'#'+h:location.pathname+location.search)}catch(e){}}
function fromHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  st.fam=FAM[p.get('f')]?p.get('f'):null;st.cls=CL[p.get('c')]?p.get('c'):null;
  const wi=st.cls?CL[st.cls].weapons.indexOf(p.get('w')):-1;st.w=wi>=0?wi:null;
  st.types=new Set((p.get('t')||'').split(',').filter(t=>T[t]));st.grips=new Set((p.get('grip')||'').split(',').filter(g=>GR[g]));
  const s=p.get('s');if(s&&COLS.find(c=>c[0]===s.replace('-',''))){st.sort=s.replace('-','');st.dir=s[0]==='-'?-1:1}}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,tr[data-m]');if(!t)return;
  const d=t.dataset;
  if(d.open){openMove(d.open);return}
  if(d.m){const m=moveOf(d.m);if(!$('#dock').hidden&&DOCK.view&&m&&canDock(m))preview(m);else openMove(d.m);return}
  if(t.id==='dockMore'){if(DOCK.key)openMove(DOCK.key);return}
  if(t.id==='pickMin'){pickMin(!$('#pick').classList.contains('min'));return}
  if(d.game!==undefined){if(d.game!==st.game)loadGame(d.game);return}
  if(d.fam!==undefined){st.fam=d.fam&&st.fam!==d.fam?d.fam:null;st.cls=null;st.w=null;st.shown=PAGE;renderAll();return}
  if(d.cls!==undefined){st.cls=d.cls||null;st.w=null;st.shown=PAGE;if(st.cls){st.fam=CL[st.cls].family;st.sort=null}renderAll();scrollTo({top:0,behavior:'smooth'});return}
  if(d.w!==undefined){st.w=d.w===''?null:+d.w;renderAll();return}
  if(d.pickw!==undefined){st.cls=d.pickc;st.fam=CL[st.cls].family;st.w=+d.pickw;closeSheet();renderAll();scrollTo({top:0,behavior:'smooth'});return}
  if(d.type){st.types.has(d.type)?st.types.delete(d.type):st.types.add(d.type);st.shown=PAGE;renderAll();return}
  if(d.grip){st.grips.has(d.grip)?st.grips.delete(d.grip):st.grips.add(d.grip);st.shown=PAGE;renderAll();return}
  if(d.sort){if(st.sort===d.sort){if(st.dir>0)st.dir=-1;else{st.sort=null;st.dir=1}}else{st.sort=d.sort;st.dir=1}renderAll();return}
  if(d.clear){const k=d.clear;
    if(k==='all'){st.q='';$('#q').value='';st.types.clear();st.grips.clear();st.armor=st.multi=st.noparry=false;st.max=+$('#maxStart').max}
    else if(k==='q'){st.q='';$('#q').value=''}else if(k.startsWith('type:'))st.types.delete(k.slice(5));else if(k.startsWith('grip:'))st.grips.delete(k.slice(5));
    else if(k==='max')st.max=+$('#maxStart').max;else st[k]=false;renderAll();return}
  if(t.id==='fArmor'){st.armor=!st.armor;renderAll();return}
  if(t.id==='fMulti'){st.multi=!st.multi;renderAll();return}
  if(t.id==='fNoParry'){st.noparry=!st.noparry;renderAll();return}
  if(t.id==='more'){st.shown+=PAGE;renderTable();return}
  if(t.id==='close'){closeSheet();return}
  if(t.id==='railBtn'){const r=$('#rail');r.classList.toggle('open');t.setAttribute('aria-expanded',r.classList.contains('open'))}
});
$('#scrim').onclick=closeSheet;
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{st.q=e.target.value.trim().toLowerCase();st.shown=PAGE;renderAll()},120)});
$('#maxStart').addEventListener('input',e=>{st.max=+e.target.value;st.shown=PAGE;renderAll()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus()}});
addEventListener('hashchange',()=>{if(D){fromHash();renderAll()}});
// the docked preview sticks under the header; prefetch a row's animation while the pointer is on it
new ResizeObserver(()=>document.documentElement.style.setProperty('--hdr',$('header').offsetHeight+'px')).observe($('header'));
document.addEventListener('pointerover',e=>{const r=e.target.closest('tr[data-m]');if(r&&DOCK.view&&!$('#dock').hidden){const m=moveOf(r.dataset.m);if(m)DOCK.view.then(v=>v.prefetch(m,pickName()))}});
try{if(localStorage.getItem('fd-pick-min'))pickMin(true)}catch(e){}
// Store links per game, from frame-data/stores.json (see frame-data/README.md, "Store links"). Steam and the eShop link
// directly; an affiliate store shows only once its "link" template is filled in, so ids drop in without code changes.
let STORES={};
function storeLinks(id){
  const g=STORES.games?.[id];if(!g)return [];
  const out=[],cur=STORES.steam?.curatorId;
  if(g.steam)out.push({name:'Steam',main:1,url:`https://store.steampowered.com/app/${g.steam}/`+(cur?`?curator_clanid=${encodeURIComponent(cur)}`:'')});
  if(g.eshop)out.push({name:'Nintendo eShop',main:1,url:g.eshop});
  if(g.steam)Object.entries(STORES.affiliates||{}).forEach(([k,a])=>{
    if(!a.link)return;
    const u=g.pages?.[k]||a.search.replace('{q}',encodeURIComponent(g.via||GAMES.find(x=>x.id===id).name));
    // "{url}?partner=id" also works on a URL that already has a query string
    const l=u.includes('?')?a.link.replace('{url}?','{url}&'):a.link;
    out.push({name:a.name,paid:1,url:l.replace('{enc}',encodeURIComponent(u)).replace('{url}',u)})});
  return out}
let GAMES=[];
Promise.all([fetch('frame-data/games.json').then(r=>r.json()),fetch('frame-data/stores.json').then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([j,s])=>{GAMES=j.games;STORES=s;const g=new URLSearchParams(location.hash.slice(1)).get('g');return loadGame(g||GAMES[0].id)})
  .catch(e=>{$('#table').innerHTML=`<div class="empty">Could not load frame data (${esc(e.message)}). Open this page through a web server, not as a file.</div>`});
</script>
